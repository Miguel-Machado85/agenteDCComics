# Netlify con "Base directory" = frontend: las rutas son relativas a esta carpeta.
[build]
  command = "npm run build"
  publish = "dist"
  # Solo reconstruye si cambio algo dentro de /frontend
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta la resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
